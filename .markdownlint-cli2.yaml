# markdownlint-cli2 configuration for autonomy-rails

frontMatter: "^---\\n[\\s\\S]*?\\n---\\n"
gitignore: true

customRules:
  - ./tools/markdownlint-skill-length.cjs
  - ./tools/markdownlint-reference-length.cjs
  - ./tools/markdownlint-frontmatter.cjs

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"

config:
  default: true
  MD003:
    style: "atx"
  MD009:
    br_spaces: 2
    list_item_empty_lines: true
  MD010:
    code_blocks: false
  MD013: false
  MD024:
    siblings_only: true
  MD025:
    level: 1
  MD001: false
  MD022: false
  MD026: false
  MD031: false
  MD032: false
  MD033: false
  MD036: false
  MD056: false
  MD058: false
  MD034: false
  MD040: false
  MD041: false
  MD046:
    style: "fenced"
  MD048:
    style: "backtick"
  MD060: false
