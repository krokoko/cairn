repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: autonomy-rails-build
        name: autonomy-rails build (lint + validate)
        entry: bash -c 'mise run build'
        language: system
        pass_filenames: false
        always_run: true
