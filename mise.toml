min_version = "2026.2.6"

[tools]
node = "24"
uv = "latest"
"npm:markdownlint-cli2" = "0.17"
"npm:ajv-cli" = "5"
"pipx:check-jsonschema" = "latest"
"pipx:pre-commit" = "4"
gitleaks = "latest"

[tasks."lint:md"]
description = "Lint Markdown (SKILL.md, references, docs)"
run = "markdownlint-cli2"

[tasks."lint:manifests"]
description = "Validate JSON manifests against schemas"
run = [
  "ajv validate -s schemas/marketplace.schema.json -d .claude-plugin/marketplace.json --all-errors --errors=text",
  "ajv validate -s schemas/codex-marketplace.schema.json -d .agents/plugins/marketplace.json --all-errors --errors=text",
  "ajv validate -s schemas/plugin.schema.json -d 'plugins/**/.claude-plugin/plugin.json' --all-errors --errors=text",
  "ajv validate -s schemas/codex-plugin.schema.json -d 'plugins/**/.codex-plugin/plugin.json' --all-errors --errors=text",
]

[tasks."lint:cross-refs"]
description = "Validate marketplace and plugin cross-references"
run = "node tools/validate-cross-refs.cjs"

[tasks."lint:json"]
description = "Validate all JSON files parse correctly"
run = "bash scripts/lint-json.sh"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:manifests", "lint:cross-refs", "lint:json"]

[tasks."validate:refs"]
description = "Detect broken links and orphaned reference files"
run = "python3 tools/validate-references.py"

[tasks."test:validators"]
description = "Test the report-validator hook scripts"
run = "bash tests/validators/run.sh"

[tasks.validate]
description = "Run validation checks"
depends = ["validate:refs", "test:validators", "security:secrets"]

[tasks.build]
description = "Lint and validate (CI entrypoint)"
depends = ["lint", "validate"]

[tasks.check]
description = "Alias for build"
depends = ["build"]

[tasks."security:secrets"]
description = "Scan for secrets with gitleaks"
run = "gitleaks detect --source . --no-banner"

[tasks."pre-commit"]
description = "Run pre-commit on all files"
run = "pre-commit run --all-files"
